github:
  api_base_url: "https://api.github.com"
  user_agent: "RepoSeer/0.1.0"
  per_page: 100
  rate_limit_buffer: 10

pypi:
  api_base_url: "https://pypi.org/pypi"
  stats_url: "https://api.pepy.tech"

deps_dev:
  api_base_url: "https://api.deps.dev/v3"

osv:
  api_base_url: "https://api.osv.dev/v1"

external:
  providers:
    - name: "hackernews"
      api_base_url: "https://hn.algolia.com/api/v1"
      enabled: true
    - name: "stackexchange"
      configuration: "STACKEXCHANGE_API_KEY"
      api_base_url: "https://api.stackexchange.com/2.3"
      enabled: true
    - name: "devto"
      configuration: "DEVTO_API_KEY"
      api_base_url: "https://dev.to/api"
      enabled: true
    - name: "rss"
      configuration: "REPOSEER_RSS_FEEDS"
      coverage: "configured_feed_entries_only"
      enabled: true
    - name: "news"
      api_base_url: "https://newsapi.org/v2"
      configuration: "NEWS_API_KEY"
      coverage: "current_plan_accessible_articles_only"
      enabled: true
